version: '3.8'

services:
  clouddrive:
    build:
      context: .
      dockerfile: Dockerfile
    image: clouddrive:latest
    container_name: clouddrive-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3051:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/setup/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

